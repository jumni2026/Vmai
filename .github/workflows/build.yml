name: VMAX Enterprise Build

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      # 3. Configure Gradle environment/cache
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Make Gradle Wrapper executable
      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      # 5. Verify Gradle Wrapper
      - name: Verify Gradle Wrapper
        run: |
          echo "Checking Gradle Wrapper..."
          ls -la ./gradlew
          test -f ./gradlew
          test -x ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.jar
          test -f ./gradle/wrapper/gradle-wrapper.properties
          echo "Gradle Wrapper verification successful."

      # 6. Display Java and Gradle versions
      - name: Display build environment
        run: |
          java -version
          ./gradlew --version

      # 7. Build entire VMAX project
      - name: Build with Gradle
        run: ./gradlew build --stacktrace --no-daemon

      # 8. Verify Debug APK exists
      - name: Verify Debug APK
        run: |
          echo "Checking for generated Debug APK..."
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "Debug APK found successfully."

      # 9. Upload Debug APK as GitHub Actions artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VMAX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 10. Always show final status
      - name: Build completed
        if: success()
        run: echo "VMAX Enterprise build and APK artifact completed successfully."
