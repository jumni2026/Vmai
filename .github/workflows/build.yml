name: Android CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  # Manual trigger for cache clearing
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Validate Gradle Wrapper
      # ------------------------------------------------------------
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      # ------------------------------------------------------------
      # 3. Setup JDK
      # ------------------------------------------------------------
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ------------------------------------------------------------
      # 4. Make Gradle wrapper executable
      # ------------------------------------------------------------
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------
      # 5. Clear Gradle Cache (to fix unresolved reference errors)
      # ------------------------------------------------------------
      - name: Clear Gradle Cache
        run: |
          echo "Clearing Gradle cache to fix unresolved reference errors..."
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          echo "Cache cleared successfully."

      # ------------------------------------------------------------
      # 6. Clean previous build outputs
      # ------------------------------------------------------------
      - name: Clean
        run: ./gradlew clean --no-daemon

      # ------------------------------------------------------------
      # 7. Build with no cache and rerun tasks
      # ------------------------------------------------------------
      - name: Build and Test
        run: |
          ./gradlew build \
            --no-build-cache \
            --rerun-tasks \
            --no-daemon \
            --stacktrace
        continue-on-error: false

      # ------------------------------------------------------------
      # 8. Build Debug APK
      # ------------------------------------------------------------
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-build-cache \
            --rerun-tasks \
            --no-daemon
        continue-on-error: false

      # ------------------------------------------------------------
      # 9. Verify APK exists
      # ------------------------------------------------------------
      - name: Verify Debug APK
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "✅ Debug APK created successfully."
            ls -lh app/build/outputs/apk/debug/
          else
            echo "❌ Debug APK not found!"
            exit 1
          fi

      # ------------------------------------------------------------
      # 10. Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VMAX-Enterprise-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ------------------------------------------------------------
      # 11. Upload Test Results (if any)
      # ------------------------------------------------------------
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

      # ------------------------------------------------------------
      # 12. Upload Build Reports
      # ------------------------------------------------------------
      - name: Upload Build Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
