name: Android CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Setup JDK 21
      # ------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      # ------------------------------------------------------------
      # 3. Setup Gradle
      #    Uses Gradle Wrapper version from the repository.
      #    Also provides Gradle caching and wrapper validation.
      # ------------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      # ------------------------------------------------------------
      # 4. Make Gradle wrapper executable
      # ------------------------------------------------------------
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------
      # 5. Show Java and Gradle versions
      # ------------------------------------------------------------
      - name: Show build environment
        run: |
          java -version
          ./gradlew --version

      # ------------------------------------------------------------
      # 6. Clean build outputs
      # ------------------------------------------------------------
      - name: Clean
        run: ./gradlew clean --no-daemon --stacktrace

      # ------------------------------------------------------------
      # 7. Compile and test
      # ------------------------------------------------------------
      - name: Build and Test
        run: |
          ./gradlew build \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ------------------------------------------------------------
      # 8. Build Debug APK
      # ------------------------------------------------------------
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ------------------------------------------------------------
      # 9. Verify APK
      # ------------------------------------------------------------
      - name: Verify Debug APK
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Debug APK created successfully."
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "Debug APK not found!"
            exit 1
          fi

      # ------------------------------------------------------------
      # 10. Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VMAX-Enterprise-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ------------------------------------------------------------
      # 11. Upload test results
      # ------------------------------------------------------------
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

      # ------------------------------------------------------------
      # 12. Upload build reports
      # ------------------------------------------------------------
      - name: Upload Build Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
